<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order — Glass</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="stylesheet" href="assets/glass.css" />
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("glass-theme");
          var dark = !choice || choice.replace(/"/g, "") !== "light";
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {}
      })();
    </script>
  </head>

  <body class="glass-canvas">
    <div data-header></div>

    <main class="wrap wrap--narrow" style="padding-block: 5rem 7rem" id="order"></main>

    <script src="assets/data.js"></script>
    <script src="assets/glass.js"></script>
    <script>
      (function () {
        var G = window.Glass;
        var host = document.getElementById("order");
        var id = new URLSearchParams(window.location.search).get("id");
        var order = id ? G.findOrder(id) : null;

        if (!order) {
          host.innerHTML =
            '<div class="confirm glass glass-rim">' +
            '<div class="empty__icon" style="width:3rem;height:3rem;margin-inline:auto">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" /></svg>' +
            "</div>" +
            '<h1 class="confirm__title" style="margin-top:1.5rem">We couldn\'t find that order</h1>' +
            '<p class="confirm__lede">Orders live in the browser that placed them. Open your account to see what is there, or start again from the suite.</p>' +
            '<div class="confirm__actions">' +
            '<a class="btn btn--primary" href="account.html">Your account</a>' +
            '<a class="btn btn--ghost" href="catalog.html">See the suite</a>' +
            "</div>" +
            "</div>";
          return;
        }

        var items = order.items
          .map(function (item) {
            return (
              '<li class="line">' +
              '<div class="line__body" style="flex-direction:row;align-items:baseline;justify-content:space-between;gap:1rem">' +
              "<span>" + G.escapeHtml(item.name) +
              '<span class="muted" style="margin-left:0.5rem">× ' + item.quantity + "</span></span>" +
              '<span class="tabular">' + G.formatPrice(item.lineTotalCents, order.currency) + "</span>" +
              "</div>" +
              "</li>"
            );
          })
          .join("");

        host.innerHTML =
          '<div class="confirm glass glass-rim glass-sheen">' +
          '<div class="confirm__icon">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>' +
          "</div>" +
          '<h1 class="confirm__title">Thank you. Your reservation is recorded.</h1>' +
          '<p class="confirm__lede">Your seats are held against your account, and every future build is included. Payment is not connected in this build, so the order below is marked as awaiting payment.</p>' +

          '<div class="card glass" style="margin-top:2.5rem;padding:1.5rem;text-align:left;border-radius:1rem">' +
          '<div class="order__head" style="font-size:0.75rem">' +
          '<span class="eyebrow" style="letter-spacing:0.14em">Order</span>' +
          "<span>" + G.formatOrderDate(order.createdAt) + "</span>" +
          "</div>" +
          '<ul style="margin-top:1.25rem;padding:0;list-style:none" class="summary__lines">' + items + "</ul>" +
          '<div class="summary__total"><span>Total</span>' +
          '<span class="tabular">' + G.formatPrice(order.totalCents, order.currency) + "</span></div>" +
          '<p class="order__foot" style="border-top:0;padding-top:1rem;margin-top:0.5rem">' +
          '<span>Status · Awaiting payment</span>' +
          "<span>Reference · #" + order.id.slice(-6).toUpperCase() + "</span>" +
          (order.company ? "<span>Licensed to " + G.escapeHtml(order.company) + "</span>" : "") +
          (order.note ? "<span>Note: " + G.escapeHtml(order.note) + "</span>" : "") +
          "</p>" +
          "</div>" +

          '<div class="confirm__actions">' +
          '<a class="btn btn--primary" href="account.html">View your orders</a>' +
          '<a class="btn btn--ghost" href="catalog.html">Keep browsing</a>' +
          "</div>" +
          "</div>";
      })();
    </script>
  </body>
</html>
